syntax = "proto3";

package siplicity.v1;

option go_package = "./;siplicityv1";

service SiplicityService {
    rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {}
    rpc PutFilePath(PutFilePathRequest) returns (PutFilePathResponse) {}
    rpc PutJob(PutJobRequest) returns (PutJobResponse) {}
    rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse) {}
    rpc GetRecord(GetRecordRequest) returns (GetRecordResponse) {}
    rpc Shutdown(ShutdownRequest) returns (ShutdownResponse) {}
}

message GetStatusRequest {
    int32 status = 1;
}

message GetStatusResponse {
    bool done = 1;
}

message PutFilePathRequest {
    string path = 1;
}

message PutFilePathResponse {
    int32 status = 1;
}

message PutJobRequest {
    optional string filter = 1;
    string action = 2;
}

message PutJobResponse {
    int32 status = 1;
}

message ListRecordsResponse {
    int32 id = 1;
    RecordType typ = 2;
    string name = 3;
    repeated ListRecordsResponse children = 4;
}

message ListRecordsRequest {
    optional int32 id = 1;
    optional bool output = 2;
    optional GetField field = 3;
}

enum RecordType {
  RECORD_TYPE_UNSPECIFIED = 0;
  RECORD_TYPE_ROOT = 1;
  RECORD_TYPE_FILE = 2;
  RECORD_TYPE_VIRTUAL_FILE = 3;
  RECORD_TYPE_DIRECTORY = 4;
  RECORD_TYPE_VIRTUAL_DIRECTORY = 5;
  RECORD_TYPE_ARCHIVE = 6;
  RECORD_TYPE_VIRTUAL_ARCHIVE = 7;
}

message GetRecordRequest {
    int32 id = 1;
}

message GetField {
    string namespace = 1;
    string name = 2;
}

message Field {
    string namespace = 1;
    string name = 2;
    string value = 3;
}

message Metadata {
    Field field = 1;
    repeated Metadata children = 2;
}

message GetRecordResponse {
    RecordType typ = 1;
    string path = 2;
    int64 size = 3;
    repeated Metadata metadata = 4;
}

message ShutdownRequest {}

message ShutdownResponse {}